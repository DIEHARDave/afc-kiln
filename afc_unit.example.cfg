# KILN_AFC: another AFC unit in place of the IFS. Copy this file to
# /home/klipper/printer_data/config/AFC/afc_unit.cfg, add the unit below,
# then RESTART. plugin.cfg includes it after its own sections, so options
# here win; the [AFC_FF] section makes the plugin drop its IFS unit
# sections (lanes 1-4 on the IFS). Delete the file to go back to the IFS.
#
# The unit: its [mcu] (USB: serial: /dev/serial/by-id/usb-Klipper_...),
# unit, hub and lane sections, from AFC's templates/ and config/mcu/ (in
# this plugin's AFC-Klipper-Add-On folder), e.g. templates/AFC_Turtle_1.cfg
# with config/mcu/AFC_Lite.cfg (BoxTurtle on an AFC-Lite) or
# templates/AFC_Vivid_1.cfg with config/mcu/Vivid.cfg. Build the unit's MCU
# firmware from Kiln's Klipper commit (kiln-os
# buildroot/package/klipper/klipper.mk).
#
# Experimental: tested in an emulator only, not yet with a real unit.
# Measure tool_stn / tool_stn_unload on your printer.

[AFC]
default_material_temps: default: 220, PLA:220, PETG:240, ABS:250, ASA:250, TPU:230
z_hop: 0
force_assign_map: True
# plugin.cfg turns these off for the IFS; AFC's defaults for its own units
load_to_hub: True
assisted_unload: True
auto_home: True
tool_cut: True
tool_cut_cmd: _AFC_FF_CUT
park: True
park_cmd: _AFC_FF_PARK
poop: True
poop_cmd: _AFC_FF_POOP
wipe: True
wipe_cmd: _AFC_FF_WIPE
kick: False
form_tip: False

[AFC_prep]
enable: True

[delayed_gcode afc_welcome]
initial_duration: 2
gcode:
    PREP

# Must be before [AFC_extruder]
[AFC_FF]
firmware: kiln
# Kiln's [adc_filament_sensor toolhead] pauses on runout; AFC owns runout now
disable_sensors: filament_switch_sensor toolhead

[AFC_extruder extruder]
u1_filament_sensor_name: ff_head
# Head sensor to nozzle (Kiln's IFS unloads 60 mm to clear the gears,
# prime_length 12 fills the nozzle)
tool_stn: 72
tool_stn_unload: 60
tool_sensor_after_extruder: 0
tool_unload_speed: 25
tool_load_speed: 25

[gcode_macro _AFC_FF_CUT]
description: AD5X cutter, Kiln's cut_gcode moves (cut at X -2.5 / Y -7.5 + unit.cfg offsets)
gcode:
    {% set unit = printer['gcode_macro _AD5X_UNIT'] %}
    RESPOND MSG="AFC_FF: cut"
    G90
    G1 Y10 F18000
    G1 Y{unit.cut_y_offset - 7.5} F1800
    G1 X20 F12000
    G1 X{unit.cut_x_offset - 2.5} F600
    M400
    M83
    G1 E-5 F600
    M400
    G90
    G1 X20 F12000
    M400

[gcode_macro _AFC_FF_PARK]
description: Into Kiln's purge box (_PURGE_BOX, TRASH_OFFSET aware)
gcode:
    RESPOND MSG="AFC_FF: park at the purge box"
    _PURGE_BOX

[gcode_macro _AFC_FF_POOP]
description: Purge in the box as Kiln's purge_gcode does (fan off, flush, fan on, retract, wipe)
gcode:
    {% set length = params.PURGE_LENGTH|default(90)|float %}
    RESPOND MSG="AFC_FF: purge {length} mm"
    _PURGE_BOX
    M106 S0
    M83
    G1 E{length} F300
    M400
    M106 S125
    G4 P3000
    G1 E-3 F300
    M400
    _PURGE_WIPE
    M106 S0

[gcode_macro _AFC_FF_WIPE]
description: Kiln's nozzle brush across the purge box (_NOZZLE_BRUSH)
gcode:
    RESPOND MSG="AFC_FF: brush"
    _NOZZLE_BRUSH

# ---- Your unit below ----
# [include /data/ad5x/plugins/afc/AFC-Klipper-Add-On/config/mcu/AFC_Lite.cfg]
# [mcu Turtle_1]
# serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_...
# [AFC_BoxTurtle Turtle_1]
# ...
